[project]
name = "pump_bot"
version = "2.0"
description = "Trade tokens on pump.fun"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "base58>=2.1.1",
    "construct>=2.10.70",
    "solana>=0.40.3",
    "solders>=0.29.0",
    "websockets>=17.1",
    "python-dotenv>=1.2.3",
    "aiohttp>=3.14.3",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "pyyaml>=6.0.3",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "winloop>=0.1.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    # protoc; only needed to regenerate src/geyser/generated from src/geyser/proto
    "grpcio-tools>=1.84.0",
]

[project.scripts]
pump_bot = "bot_runner:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "N", "B", "A", "C4", "T10", "ARG", "PTH",
    "ANN",  # type annotations
    "S",    # security best practices
    "BLE",  # blind except statements
    "FBT",  # boolean trap parameters
    "C90",  # complexity metrics
    "TRY",  # exception handling best practices
    "SLF",  # private member access
    "TCH",  # type checking issues
    "RUF",  # Ruff-specific rules
    "ERA",  # eradicate commented-out code
    "PL",   # pylint conventions
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
