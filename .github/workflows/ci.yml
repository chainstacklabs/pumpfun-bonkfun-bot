name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.7"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile source and examples
        run: uv run python -m compileall -q src learning-examples tests

      - name: Run security lint on fund-moving boundaries
        run: >-
          uv run ruff check --select S
          src/core
          src/cleanup
          src/config_loader.py
          src/bot_runner.py
          src/monitoring
          src/trading/platform_aware.py
          src/trading/universal_trader.py
          src/platforms/pumpfun
          src/platforms/letsbonk

      - name: Check protocol and safety drift
        run: |
          uv run learning-examples/verify_v2_account_layout.py
          uv run learning-examples/verify_create_v2_optional_args.py
          uv run learning-examples/verify_pumpportal_buy_path.py
          uv run learning-examples/verify_extreme_fast_zero_rpc.py
          uv run learning-examples/verify_tx_status_checks.py
          uv run learning-examples/verify_tp_sl_exit_price.py

      - name: Run tests
        run: uv run pytest -q
